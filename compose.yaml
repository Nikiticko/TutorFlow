services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tutorflow
      POSTGRES_DB: tutorflow
      # Local-only instance, bound to loopback. No production credentials.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tutorflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorflow -d tutorflow"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  tutorflow_pg:
